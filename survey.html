<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食堂アンケート - OliMeal</title>
  <style>
    :root {
      --ink: #3a2a16;
      --muted: #8a6240;
      --paper: #fffdf9;
      --chip: #fff;
      --line: #f0dcc8;
      --on: #f6c453;
      --on-ink: #3a2a16;
      --accent: #e07a3d;
      --send: #f5c542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #fff7ef 0%, #ffe6d2 100%);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 40px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .mark {
      width: 42px; height: 42px; border-radius: 14px; background: #fff; color: var(--accent);
      display: grid; place-items: center; font-weight: 800; box-shadow: 0 6px 16px rgba(180, 110, 50, 0.12);
    }
    .brand { font-weight: 800; line-height: 1.2; }
    .brand small { display: block; font-weight: 600; color: var(--muted); }
    .card {
      background: var(--paper); border-radius: 28px; padding: 22px 18px 18px;
      box-shadow: 0 16px 40px rgba(160, 100, 50, 0.12);
    }
    h1 { font-size: 1.55rem; margin: 0 0 6px; }
    .lead { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    label { display: block; font-weight: 800; margin-bottom: 8px; }
    .req { color: var(--accent); font-weight: 800; }
    input[type="text"] {
      width: 100%; border: 2px solid var(--line); background: #fff; border-radius: 999px;
      padding: 14px 18px; font-size: 1.05rem; color: var(--ink);
    }
    input[type="text"]:focus { outline: 3px solid #f6d48a; border-color: #e7b34d; }
    .hint, .error { margin: 8px 4px 0; line-height: 1.5; }
    .hint { color: var(--muted); font-size: 0.92rem; }
    .error { color: #9b2c2c; font-weight: 700; min-height: 1.4em; }
    .group { margin-top: 22px; }
    .group h2 { margin: 0 0 6px; font-size: 1.05rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1.5px solid #eadfce; background: var(--chip); color: var(--ink); border-radius: 999px;
      padding: 10px 16px; font-size: 1rem; font-weight: 700; cursor: pointer; min-height: 48px;
    }
    .chip[aria-pressed="true"] { background: var(--on); border-color: #e2ae3a; color: var(--on-ink); }
    .add-row { display: flex; gap: 8px; margin-top: 10px; }
    .add-row input { flex: 1; }
    .add-row button, .ghost {
      border: 1.5px solid #eadfce; background: #fff; color: var(--ink); border-radius: 999px;
      font-weight: 800; padding: 0 16px; min-height: 48px; cursor: pointer;
    }
    .allergy-box {
      margin-top: 22px; background: #fff6ee; border-radius: 18px; padding: 14px 16px;
    }
    .allergy-box summary { font-weight: 800; cursor: pointer; }
    .send, .ghost.wide {
      margin-top: 12px; width: 100%; border: 0; font-weight: 800; font-size: 1.05rem;
      border-radius: 999px; min-height: 56px; cursor: pointer;
    }
    .send { background: var(--send); color: #3a2a16; }
    .send:disabled { opacity: 0.55; cursor: wait; }
    .ghost.wide { background: #fff; border: 1.5px solid #eadfce; color: var(--ink); }
    .done { text-align: center; }
    .done h1 { font-size: 1.7rem; }
    .summary {
      text-align: left; background: #fff6ee; border-radius: 18px; padding: 14px 16px;
      line-height: 1.7; margin: 14px 0;
    }
    .back {
      display: inline-block; margin-top: 8px; background: #06c755; color: #fff; text-decoration: none;
      font-weight: 800; border-radius: 999px; padding: 14px 22px;
    }
    .missing { padding: 28px 8px; text-align: center; }
    a.inline { color: var(--accent); font-weight: 800; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="mark">食</div>
      <div class="brand">OliMeal<small>かんたんアンケート</small></div>
    </div>
    <main class="card" id="card">
      <p>読み込んでいます…</p>
    </main>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const key = params.get('key') || '';
    const card = document.getElementById('card');
    const state = {
      favorites: [],
      customs: [],
      avoids: [],
      avoidCustoms: [],
      styles: [],
      allergies: [],
      allergyCustoms: [],
      times: '',
      source: null
    };

    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    function normalizeName(value) {
      return String(value || '').replace(/[\s\u3000]+/g, ' ').trim();
    }

    function nameError(value) {
      const name = normalizeName(value);
      if (!name) return '名前が空白だよ。姓と名を入れてね。例: 瀬尾 太郎';
      if ([...name].length > 20) return '名前は20文字以内のフルネームにしてね。例: 瀬尾 太郎';
      const parts = name.split(/[\s・･·]+/).filter(Boolean);
      const letters = name.replace(/[^\p{L}]/gu, '');
      const letterParts = parts.filter(function (part) { return /\p{L}/u.test(part); }).length;
      if (!letters) return '名前は文字で入れてね。例: 瀬尾 太郎';
      if (letterParts < 2 && [...letters].length < 3) {
        return 'フルネームで入れてね。姓だけは送れないよ。例: 瀬尾 太郎';
      }
      return '';
    }

    function chip(label, pressed, group, value) {
      return '<button type="button" class="chip" data-group="' + esc(group) + '" data-value="' + esc(value || label) + '" aria-pressed="' + (pressed ? 'true' : 'false') + '">' + esc(label) + '</button>';
    }

    function managedNames(aliases) {
      const names = {};
      Object.keys(aliases || {}).forEach(function (id) {
        (aliases[id] || []).forEach(function (name) { names[name] = true; });
        names[id] = true;
      });
      return names;
    }

    function favoriteOn(id, likes, aliases) {
      const names = (aliases && aliases[id]) || [id];
      return likes.some(function (like) { return names.indexOf(like) !== -1; });
    }

    function splitKnown(values, choices) {
      const known = {};
      choices.forEach(function (label) { known[label] = true; });
      return {
        picked: values.filter(function (label) { return known[label]; }),
        extra: values.filter(function (label) { return !known[label]; })
      };
    }

    function renderForm(data) {
      state.source = data;
      const likes = data.likes || [];
      const aliases = data.favoriteAliases || {};
      const favorites = data.favoriteChoices || [];
      const managed = managedNames(aliases);
      state.favorites = favorites.filter(function (item) { return favoriteOn(item.id, likes, aliases); }).map(function (item) { return item.id; });
      state.customs = likes.filter(function (like) { return !managed[like]; });
      const avoidSplit = splitKnown(data.avoids || [], data.avoidChoices || []);
      state.avoids = avoidSplit.picked;
      state.avoidCustoms = avoidSplit.extra;
      state.styles = (data.styles || []).slice();
      const timeChoices = data.timeChoices || [];
      state.times = timeChoices.indexOf(data.timesPerWeek) !== -1 ? data.timesPerWeek : '';
      const timeChips = timeChoices.map(function (label) {
        return chip(label, state.times === label, 'time', label);
      }).join('');
      const allergySplit = splitKnown(data.allergies || [], data.allergyChoices || []);
      state.allergies = allergySplit.picked;
      state.allergyCustoms = allergySplit.extra;
      const favoriteChips = favorites.map(function (item) {
        return chip(item.label, state.favorites.indexOf(item.id) !== -1, 'favorite', item.id);
      }).join('');
      const customChips = state.customs.map(function (label) { return chip(label, true, 'custom', label); }).join('');
      const styleChips = (data.styleChoices || []).map(function (label) {
        return chip(label, state.styles.indexOf(label) !== -1, 'style', label);
      }).join('');
      const avoidChips = (data.avoidChoices || []).map(function (label) {
        return chip(label, state.avoids.indexOf(label) !== -1, 'avoid', label);
      }).join('') + state.avoidCustoms.map(function (label) { return chip(label, true, 'avoidCustom', label); }).join('');
      const allergyChips = (data.allergyChoices || []).map(function (label) {
        return chip(label, state.allergies.indexOf(label) !== -1, 'allergy', label);
      }).join('') + state.allergyCustoms.map(function (label) { return chip(label, true, 'allergyCustom', label); }).join('');
      card.innerHTML = ''
        + '<h1>答えてね</h1>'
        + '<p class="lead">好きな料理、苦手、料理のタイプと、食堂に来る回数。あとから直せるよ。アレルギーは好き嫌いとは別だよ。</p>'
        + '<form id="survey-form">'
        + '<label for="full-name">名前 <span class="req">必須</span></label>'
        + '<input id="full-name" type="text" maxlength="20" autocomplete="name" placeholder="例: 瀬尾 太郎" value="' + esc(data.name || '') + '" required>'
        + '<p class="error" id="name-error" role="alert"></p>'
        + '<section class="group"><h2>1. 好きな料理・食材は？</h2><p class="hint">いくつでも押せるよ。</p><div class="chips">' + favoriteChips + '</div>'
        + '<div class="chips" id="extra-custom">' + customChips + '</div>'
        + '<div class="add-row"><input id="custom-input" type="text" maxlength="20" placeholder="その他 例: オムライス"><button type="button" id="custom-add">追加</button></div></section>'
        + '<section class="group"><h2>2. 苦手な料理・食材は？</h2><p class="hint">空でも大丈夫。任意だよ。</p><div class="chips" id="avoid-chips">' + avoidChips + '</div>'
        + '<div class="add-row"><input id="avoid-input" type="text" maxlength="20" placeholder="例: ピーマン"><button type="button" id="avoid-add">追加</button></div></section>'
        + '<section class="group"><h2>3. どんな料理が好き？</h2><p class="hint">いくつでも、または空でも大丈夫。</p><div class="chips">' + styleChips + '</div></section>'
        + '<section class="group"><h2>4. 食堂にどれくらい来ますか？ <span class="req">必須</span></h2><p class="hint">1つ選んでね。好きな料理とは別に保存するよ。</p><div class="chips" id="time-chips">' + timeChips + '</div></section>'
        + '<details class="allergy-box"><summary>アレルギーがある人だけ（任意）</summary>'
        + '<p class="hint">好き嫌いとは別に保存するよ。原材料が分からない料理は、安全だとは判断しないよ。</p>'
        + '<div class="chips" id="allergy-chips">' + allergyChips + '</div>'
        + '<div class="add-row"><input id="allergy-input" type="text" maxlength="20" placeholder="例: ごま"><button type="button" id="allergy-add">追加</button></div>'
        + '<p class="hint"><a class="inline" href="allergy.html">メニューのアレルギー表を見る</a></p></details>'
        + '<p class="error" id="form-error" role="alert"></p>'
        + '<button class="send" type="submit">この内容で答える</button>'
        + '<button class="ghost wide" type="button" id="skip-survey">いまはスキップ</button>'
        + '</form>';
      card.querySelectorAll('.chip').forEach(function (button) {
        button.addEventListener('click', function () { toggle(button); });
      });
      document.getElementById('custom-add').addEventListener('click', function () { addExtra('custom'); });
      document.getElementById('avoid-add').addEventListener('click', function () { addExtra('avoid'); });
      document.getElementById('allergy-add').addEventListener('click', function () { addExtra('allergy'); });
      document.getElementById('survey-form').addEventListener('submit', submitForm);
      document.getElementById('skip-survey').addEventListener('click', skipForm);
    }

    function toggle(button) {
      const group = button.getAttribute('data-group');
      const value = button.getAttribute('data-value');
      const map = { favorite: 'favorites', custom: 'customs', avoid: 'avoids', avoidCustom: 'avoidCustoms', style: 'styles', allergy: 'allergies', allergyCustom: 'allergyCustoms' };
      if (group === 'time') {
        state.times = value;
        document.querySelectorAll('#time-chips .chip').forEach(function (chipButton) {
          chipButton.setAttribute('aria-pressed', chipButton === button ? 'true' : 'false');
        });
        return;
      }
      const bucket = map[group];
      if (!bucket) return;
      const on = state[bucket].indexOf(value) === -1;
      const max = bucket === 'favorites' || bucket === 'styles' ? 8 : 8;
      if (on && state[bucket].length >= max) return;
      if (on) state[bucket].push(value);
      else state[bucket] = state[bucket].filter(function (item) { return item !== value; });
      button.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    function addExtra(kind) {
      const input = document.getElementById(kind + '-input');
      const formError = document.getElementById('form-error');
      if (!input) return;
      let label = normalizeName(input.value);
      if ([...label].length > 20) label = [...label].slice(0, 20).join('');
      if (!label || label === 'とくにない') return;
      const bucket = kind === 'custom' ? 'customs' : (kind === 'avoid' ? 'avoidCustoms' : 'allergyCustoms');
      const group = kind === 'custom' ? 'custom' : (kind === 'avoid' ? 'avoidCustom' : 'allergyCustom');
      if (state[bucket].indexOf(label) !== -1) return;
      if (state[bucket].length >= 8) {
        if (formError) formError.textContent = '8個までだよ。';
        return;
      }
      state[bucket].push(label);
      input.value = '';
      if (formError) formError.textContent = '';
      const boxId = kind === 'custom' ? 'extra-custom' : (kind === 'avoid' ? 'avoid-chips' : 'allergy-chips');
      const box = document.getElementById(boxId);
      if (!box) return;
      box.insertAdjacentHTML('beforeend', chip(label, true, group, label));
      const button = box.lastElementChild;
      if (button) button.addEventListener('click', function () { toggle(button); });
    }

    function renderDone(data) {
      const avoids = (data.avoids || []).length ? data.avoids.join('、') : 'とくにない';
      const styles = (data.styles || []).length ? data.styles.join('、') : '未設定';
      const allergies = (data.allergies || []).length ? data.allergies.join('、') : 'なし';
      const back = data.addUrl ? '<a class="back" href="' + esc(data.addUrl) + '">LINEのトークに戻る</a>' : '';
      card.innerHTML = ''
        + '<div class="done"><h1>保存したよ</h1>'
        + '<p class="lead">この答えは残るよ。あとからこのページで直せる。</p>'
        + '<div class="summary"><strong>' + esc(data.name || '名前は未設定') + '</strong><br>好き: ' + esc((data.likes || []).join('、') || '未設定')
        + '<br>タイプ: ' + esc(styles)
        + '<br>苦手: ' + esc(avoids)
        + '<br>アレルギー: ' + esc(allergies)
        + '<br>食堂に来る回数: ' + esc(data.timesPerWeek || '未設定') + '</div>'
        + '<button class="ghost wide" type="button" id="edit-again">答えを直す</button>'
        + back + '</div>';
      document.getElementById('edit-again').addEventListener('click', function () { renderForm(data); });
    }

    function renderMissing(message) {
      card.innerHTML = '<div class="missing"><h1>アンケート</h1><p>' + esc(message) + '</p></div>';
    }

    async function postSurvey(body) {
      const res = await fetch('api/line-survey.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      return { res: res, data: data };
    }

    async function submitForm(event) {
      event.preventDefault();
      const name = document.getElementById('full-name').value;
      const nameProblem = nameError(name);
      document.getElementById('name-error').textContent = nameProblem;
      const formError = document.getElementById('form-error');
      formError.textContent = '';
      if (nameProblem) {
        document.getElementById('full-name').focus();
        return;
      }
      if (!state.favorites.length && !state.customs.length) {
        formError.textContent = '好きな料理を、1つ以上選ぶか、自分で書いてね。';
        return;
      }
      if (!state.times) {
        formError.textContent = '食堂にどれくらい来るか、選んでね。';
        return;
      }
      const button = event.target.querySelector('.send');
      button.disabled = true;
      try {
        const result = await postSurvey({
          key: key,
          name: normalizeName(name),
          favorites: state.favorites,
          customLikes: state.customs,
          styles: state.styles,
          avoids: state.avoids.concat(state.avoidCustoms),
          allergies: state.allergies.concat(state.allergyCustoms),
          timesPerWeek: state.times
        });
        if (!result.res.ok || !result.data.ok) {
          const message = result.data.error || '保存できなかったよ。もう一度押してね。';
          if (message.indexOf('名前') !== -1 || message.indexOf('フルネーム') !== -1) {
            document.getElementById('name-error').textContent = message;
          } else {
            formError.textContent = message;
          }
          button.disabled = false;
          return;
        }
        renderDone(result.data);
      } catch (err) {
        formError.textContent = '保存できなかったよ。もう一度押してね。';
        button.disabled = false;
      }
    }

    async function skipForm() {
      const formError = document.getElementById('form-error');
      try {
        const result = await postSurvey({ key: key, mode: 'skip' });
        if (!result.res.ok || !result.data.ok) {
          if (formError) formError.textContent = result.data.error || 'スキップできなかったよ。';
          return;
        }
        card.innerHTML = '<div class="done"><h1>またあとで大丈夫</h1><p class="lead">今の答えは消していないよ。おすすめは、分かる範囲で出すね。</p>'
          + '<button class="ghost wide" type="button" id="edit-again">やっぱり答える</button></div>';
        document.getElementById('edit-again').addEventListener('click', function () { renderForm(result.data); });
      } catch (err) {
        if (formError) formError.textContent = 'スキップできなかったよ。';
      }
    }

    if (!key) {
      renderMissing('LINEのトークから開いてね。');
    } else {
      fetch('api/line-survey.php?key=' + encodeURIComponent(key), { cache: 'no-store' })
        .then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
        .then(function (result) {
          if (!result.res.ok || !result.data.ok) {
            renderMissing(result.data.error || 'このリンクでは開けないよ。');
            return;
          }
          renderForm(result.data);
        })
        .catch(function () {
          renderMissing('読み込めなかったよ。もう一度開いてね。');
        });
    }
  </script>
</body>
</html>
