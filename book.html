<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ごはんを予約する - OliMeal</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #reservation-hours-display:empty {
      display: none;
    }

    /* 予約フォームのスタイル */
    .booking-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .booking-header {
      text-align: left;
      padding: 24px 28px 20px;
      background: var(--primary);
      color: white;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      margin-bottom: 0;
    }

    .booking-header h1 {
      font-size: 1.7rem;
      margin-bottom: 6px;
      color: white;
      font-weight: 800;
    }

    .booking-header p {
      font-size: 0.98rem;
      opacity: 0.92;
    }

    .booking-card {
      background: var(--card-bg);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-soft);
      border: 1.5px solid var(--border-color);
      border-top: none;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
      color: var(--primary);
      font-size: 0.95rem;
    }

    .form-group label .required {
      color: var(--accent-orange);
      margin-left: 4px;
    }

    .form-group input[type="text"],
    .form-group select {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1rem;
      transition: all 0.2s ease;
      background: #ffffff;
      color: var(--text-main);
    }

    .form-group input[type="text"]:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-group small {
      display: block;
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .help-note {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      background: var(--primary-subtle);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border-left: 4px solid var(--primary);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn-submit {
      flex: 2;
      padding: 15px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-soft);
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-reset {
      flex: 1;
      padding: 15px 24px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: #dbe7d5;
      transform: translateY(-1px);
    }

    /* 結果表示 */
    .result-box {
      display: none;
      margin-top: 25px;
      padding: 24px;
      border-radius: var(--radius-md);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-success {
      background: var(--status-open-bg);
      border: 2px solid var(--primary);
      color: var(--status-open-text);
    }

    .result-error {
      background: var(--status-closed-bg);
      border: 2px solid var(--accent-orange);
      color: var(--status-closed-text);
    }

    .result-box h3 {
      margin: 0 0 12px 0;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .result-box p {
      margin: 6px 0;
      line-height: 1.6;
    }

    .reservation-number {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary);
      margin: 10px 0;
      letter-spacing: 0.05em;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    /* メニュー表示 */
    .menu-preview {
      background: var(--primary-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-top: 24px;
      border: 1px solid var(--border-color);
    }

    .menu-preview h3 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: 800;
    }

    .menu-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .menu-item {
      background: white;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-color);
      text-align: center;
    }

    .menu-item-name {
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .menu-item-stock {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .menu-item-stock.unlimited {
      color: var(--primary);
      font-weight: 800;
    }

    .menu-item-stock.soldout {
      color: var(--accent-orange);
      font-weight: 800;
    }

    /* 予約状況 */
    .status-preview {
      background: var(--accent-sun-light);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-top: 20px;
      border: 1px solid var(--accent-sun);
    }

    .status-preview h3 {
      margin-top: 0;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 800;
    }

    .status-item {
      background: white;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    /* ローディング */
    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
    }

    .spinner {
      border: 3px solid var(--primary-light);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* レスポンシブ */
    @media (max-width: 768px) {
      .booking-card {
        padding: 24px 18px;
      }

      .booking-header h1 {
        font-size: 1.5rem;
      }

      .form-actions {
        flex-direction: column;
      }

      .btn-submit,
      .btn-reset {
        width: 100%;
      }

      .menu-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="olimeal-interior.css">
</head>

<body class="olimeal-interior">
  <div class="container">
    <!-- 全ページ共通ナビゲーション -->
    <nav class="site-nav" aria-label="主なメニュー">
      <a class="site-nav-brand" href="index.html" aria-label="OliMeal ホーム">
        <img src="icon.png" alt="" class="logo-nav-icon">
        <span class="logo-nav-text">OliMeal</span>
      </a>
      <div class="site-nav-links">
        <a href="index.html">ホーム</a>
        <a href="book.html" class="is-here">予約する</a>
        <a href="verification.html">予約を確認</a>
        <a href="allergy.html">アレルギー</a>
        <a href="ai-assistant-php.html">質問する</a>
      </div>
    </nav>

    <div class="booking-container">
      <div class="booking-header">
        <h1>ごはんを予約する</h1>
        <p>名前とメニューを選んで、「予約を確定する」を押してください。</p>
      </div>

      <div class="booking-card">
        <div id="today-closed-message"
          style="display:none; margin-bottom:20px; padding:16px 20px; background:var(--status-closed-bg); border:2px solid var(--accent-orange); border-radius:var(--radius-md); font-size:0.95rem; font-weight:bold; color:var(--status-closed-text);">
          🚫 本日は休業日のため、予約はできません。
        </div>

        <div id="reservation-hours-display" class="reservation-hours-box"
          style="margin-bottom:20px; padding:12px 16px; background:var(--primary-subtle); border-radius:var(--radius-md); font-size:0.92rem; border:1px solid var(--border-color);">
        </div>

        <form id="booking-form">
          <p class="help-note">💡 赤い <span style="color:var(--accent-orange); font-weight:bold;">*</span> の欄を入力して、「予約を確定する」ボタンを押してください。</p>

          <div class="form-group">
            <label for="student-name">
              お名前 <span class="required">*</span>
            </label>
            <input type="text" id="student-name" required placeholder="例: 田中太郎" autocomplete="name">
          </div>

          <div class="form-group">
            <label for="food">
              ご希望のメニュー <span class="required">*</span>
            </label>
            <select id="food" required>
              <option value="">-- 読み込み中... --</option>
            </select>
            <small>※ 在庫がないメニューは選択できません</small>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-submit" id="submit-btn">
              予約を確定する
            </button>
            <button type="button" class="btn-reset" onclick="resetForm()">
              入力を消す
            </button>
          </div>
        </form>

        <!-- 結果表示エリア -->
        <div id="result-box" class="result-box"></div>

        <!-- メニュー一覧 -->
        <div class="menu-preview">
          <h3>🍱 いま選べるメニュー</h3>
          <div id="menu-display" class="loading">
            <div class="spinner"></div>
            <p>メニューを読み込み中...</p>
          </div>
        </div>

        <!-- 今日の予約状況 -->
        <div class="status-preview">
          <h3>📊 きょうの予約のようす</h3>
          <div id="reservations-display" class="loading">
            <div class="spinner"></div>
            <p>予約状況を読み込み中...</p>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <a href="index.html" class="back-link">← ホームに戻る</a>
    </footer>
  </div>

  <script>
    // APIベースパスの解決
    function getApiBase() {
      if (typeof window === 'undefined' || !window.location) return 'api/';
      if (window.location.protocol === 'file:') return 'api/';
      const path = window.location.pathname;
      const lastSlash = path.lastIndexOf('/');
      const basePath = lastSlash >= 0 ? path.substring(0, lastSlash + 1) : '/';
      return basePath + 'api/';
    }

    let __apiBaseResolved = null;

    async function resolveApiBase() {
      if (__apiBaseResolved) return __apiBaseResolved;

      const candidates = [];
      try { candidates.push(new URL('api/', window.location.href).toString()); } catch (_) { }
      try { candidates.push(new URL('../api/', window.location.href).toString()); } catch (_) { }
      try { candidates.push(window.location.origin + '/api/'); } catch (_) { }

      const validCandidates = candidates.filter(u => {
        try { return new URL(u).origin === window.location.origin; } catch (_) { return false; }
      });

      const probePath = 'menu.php';
      for (const base of validCandidates) {
        try {
          const res = await fetch(base + probePath, { cache: 'no-store', method: 'GET' });
          if (res.ok) {
            __apiBaseResolved = base;
            return __apiBaseResolved;
          }
        } catch (e) {
          continue;
        }
      }
      __apiBaseResolved = getApiBase();
      return __apiBaseResolved;
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    function getTodayIso() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getCurrentTimeHHMM() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    let reservationTimesSettings = null;

    async function loadReservationTimesSettings() {
      try {
        const apiBase = await resolveApiBase();
        const res = await fetch(apiBase + 'reservation-times.php', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          reservationTimesSettings = data;
          return data;
        }
      } catch (e) {
        console.warn('[予約] 予約時間設定の取得に失敗:', e);
      }
      reservationTimesSettings = null;
      return null;
    }

    function isWithinReservationHours() {
      if (!reservationTimesSettings || reservationTimesSettings.enabled !== true) {
        return true;
      }
      let timeSlots = reservationTimesSettings.timeSlots;
      if (!Array.isArray(timeSlots) || timeSlots.length === 0) {
        const start = reservationTimesSettings.startTime;
        const end = reservationTimesSettings.endTime;
        if (start && end) {
          timeSlots = [{ startTime: start, endTime: end }];
        } else {
          return true;
        }
      }
      const now = getCurrentTimeHHMM();
      for (let i = 0; i < timeSlots.length; i++) {
        const slot = timeSlots[i];
        const s = (slot.startTime || '').trim();
        const e = (slot.endTime || '').trim();
        if (s && e && now >= s && now <= e) return true;
      }
      return false;
    }

    function getReservationHoursDisplayText() {
      if (!reservationTimesSettings || reservationTimesSettings.enabled !== true) {
        return null;
      }
      let timeSlots = reservationTimesSettings.timeSlots;
      if (!Array.isArray(timeSlots) || timeSlots.length === 0) {
        const start = reservationTimesSettings.startTime;
        const end = reservationTimesSettings.endTime;
        if (start && end) timeSlots = [{ startTime: start, endTime: end }];
        else return null;
      }
      const parts = timeSlots.map(s => `${s.startTime}〜${s.endTime}`);
      return parts.join('、');
    }

    async function isTodayClosed() {
      try {
        const apiBase = await resolveApiBase();
        const holidaysRes = await fetch(apiBase + 'holidays.php', { cache: 'no-store' });
        const holidays = (holidaysRes.ok && await holidaysRes.json().catch(() => [])) || [];
        const today = getTodayIso();
        const registered = (holidays || []).find(h => (h.date || '') === today);
        if (registered) return { closed: true, reason: registered.reason || '休業日' };
        return false;
      } catch (e) {
        return false;
      }
    }

    async function loadMenuAndStatus() {
      const foodSelect = document.getElementById('food');
      const menuDisplay = document.getElementById('menu-display');
      const reservationsDisplay = document.getElementById('reservations-display');
      const reservationHoursDisplay = document.getElementById('reservation-hours-display');
      const todayClosedEl = document.getElementById('today-closed-message');
      const bookingForm = document.getElementById('booking-form');
      const submitBtn = document.getElementById('submit-btn');

      try {
        const apiBase = await resolveApiBase();
        const closedResult = await isTodayClosed();
        const closed = closedResult && (closedResult.closed === true || closedResult === true);
        const reason = (closedResult && closedResult.reason) ? closedResult.reason : '';

        if (closed && todayClosedEl) {
          todayClosedEl.style.display = 'block';
          todayClosedEl.innerHTML = '🚫 本日は休業日のため、予約はできません。' + (reason ? '<br><span style="font-size:0.88em;">理由: ' + escapeHtml(reason) + '</span>' : '');
          if (reservationHoursDisplay) reservationHoursDisplay.style.display = 'none';
          if (bookingForm) {
            bookingForm.querySelectorAll('input, select, button[type="submit"]').forEach(el => { el.disabled = true; });
          }
          if (submitBtn) submitBtn.disabled = true;
        } else {
          if (todayClosedEl) todayClosedEl.style.display = 'none';
          if (reservationHoursDisplay) reservationHoursDisplay.style.display = '';
          if (bookingForm) bookingForm.querySelectorAll('input, select, button[type="submit"]').forEach(el => { el.disabled = false; });
          if (submitBtn) submitBtn.disabled = false;
        }

        await loadReservationTimesSettings();
        const [menuRes, resRes] = await Promise.all([
          fetch(apiBase + 'menu.php', { cache: 'no-store' }),
          fetch(apiBase + 'sales-data.php?reservations=true', { cache: 'no-store' })
        ]);

        if (reservationHoursDisplay && !closed) {
          const text = getReservationHoursDisplayText();
          const within = isWithinReservationHours();
          if (text) {
            reservationHoursDisplay.innerHTML = '<span class="reservation-hours-label">⏰ 予約可能時間: </span><strong>' +
              escapeHtml(text) + '</strong>' +
              (within ? ' <span style="color:var(--primary); font-weight:bold;">（現在予約可能）</span>' : ' <span style="color:var(--accent-orange); font-weight:bold;">（現在は予約時間外です）</span>');
          } else {
            reservationHoursDisplay.innerHTML = '<span class="reservation-hours-label">⏰ 予約可能時間: </span>制限なし（いつでも予約可能）';
          }
        }

        if (menuRes.ok) {
          const menus = await menuRes.json().catch(() => []);
          if (Array.isArray(menus) && menus.length > 0) {
            if (foodSelect) {
              foodSelect.innerHTML = '<option value="">-- 選択してください --</option>' +
                menus.map(m => {
                  const label = m.stock === -1
                    ? `${m.name}（無制限）`
                    : `${m.name}（残り${m.stock}食）`;
                  const disabled = (m.stock !== -1 && m.stock <= 0) ? ' disabled' : '';
                  return `<option value="${escapeHtml(m.name)}"${disabled}>${escapeHtml(label)}</option>`;
                }).join('');
            }

            if (menuDisplay) {
              menuDisplay.innerHTML = '<div class="menu-list">' +
                menus.map(m => {
                  let stockClass = '';
                  let stockText = '';
                  if (m.stock === -1) {
                    stockClass = 'unlimited';
                    stockText = '無制限';
                  } else if (m.stock <= 0) {
                    stockClass = 'soldout';
                    stockText = '売り切れ';
                  } else {
                    stockText = `残り${m.stock}食`;
                  }
                  return `
                    <div class="menu-item">
                      <div class="menu-item-name">${escapeHtml(m.name)}</div>
                      <div class="menu-item-stock ${stockClass}">${stockText}</div>
                    </div>
                  `;
                }).join('') + '</div>';
            }
          } else {
            if (foodSelect) foodSelect.innerHTML = '<option value="">メニューが登録されていません</option>';
            if (menuDisplay) menuDisplay.innerHTML = '<p>メニューが登録されていません。</p>';
          }
        } else {
          if (foodSelect) foodSelect.innerHTML = '<option value="">メニューの読み込みに失敗しました</option>';
          if (menuDisplay) menuDisplay.innerHTML = '<p style="color: var(--accent-orange);">メニューの読み込みに失敗しました。</p>';
        }

        if (resRes.ok) {
          const raw = await resRes.json();
          const list = Array.isArray(raw) ? raw : (raw?.reservations || []);
          const today = getTodayIso();
          const byFood = {};

          list
            .filter(r => String(r.date || '') === today)
            .forEach(r => {
              const f = (r.food && String(r.food).trim()) || '（未設定）';
              if (!byFood[f]) byFood[f] = 0;
              byFood[f] += (r.people || 1);
            });

          const entries = Object.entries(byFood);
          if (reservationsDisplay) {
            if (entries.length === 0) {
              reservationsDisplay.innerHTML = '<p style="color: var(--text-muted); padding: 4px 0;">🍳 きょうの予約はまだ届いていません。一番乗りで予約してみよう！</p>';
            } else {
              reservationsDisplay.innerHTML = entries.map(([food, n]) =>
                `<div class="status-item">
                  <span><strong>${escapeHtml(food)}</strong></span>
                  <span style="font-weight: bold; color: var(--primary);">${n}人</span>
                </div>`
              ).join('');
            }
          }
        } else {
          if (reservationsDisplay) {
            reservationsDisplay.innerHTML = '<p style="color: var(--accent-orange);">予約状況の読み込みに失敗しました。</p>';
          }
        }
      } catch (e) {
        console.error('データの読み込みエラー:', e);
      }
    }

    function showResult(success, html) {
      const resultBox = document.getElementById('result-box');
      if (!resultBox) return;

      resultBox.className = `result-box ${success ? 'result-success' : 'result-error'}`;
      resultBox.innerHTML = html;
      resultBox.style.display = 'block';
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function hideResult() {
      const resultBox = document.getElementById('result-box');
      if (resultBox) resultBox.style.display = 'none';
    }

    function resetForm() {
      document.getElementById('booking-form').reset();
      hideResult();
    }

    async function submitReservation(formData) {
      const closedResult = await isTodayClosed();
      if (closedResult && (closedResult.closed === true || closedResult === true)) {
        const r = (closedResult.reason || '休業日です');
        throw new Error('本日は休業日のため、予約できません。（' + r + '）');
      }

      if (reservationTimesSettings === null) {
        await loadReservationTimesSettings();
      }

      if (reservationTimesSettings && reservationTimesSettings.enabled === true) {
        if (!isWithinReservationHours()) {
          const text = getReservationHoursDisplayText();
          throw new Error('現在は予約時間外です。予約可能時間: ' + (text || '—') + ' の間にご予約ください。');
        }
      }

      const apiBase = await resolveApiBase();
      const menuUrl = apiBase + 'menu.php';
      const menuResponse = await fetch(menuUrl, { cache: 'no-store' });
      if (!menuResponse.ok) {
        throw new Error(`メニューデータの取得に失敗しました`);
      }

      const menus = await menuResponse.json();
      const selectedMenu = menus.find(menu => menu.name === formData.food);

      if (!selectedMenu) {
        throw new Error('選択されたメニューが見つかりません');
      }

      if (selectedMenu.stock !== -1 && selectedMenu.stock <= 0) {
        throw new Error('このメニューは売り切れです');
      }

      if (selectedMenu.stock !== -1) {
        selectedMenu.stock -= 1;
        const updateResponse = await fetch(apiBase + 'menu.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(menus)
        });

        if (!updateResponse.ok) {
          throw new Error('メニューの残数更新に失敗しました');
        }
      }

      const reservation = {
        id: Date.now(),
        date: getTodayIso(),
        time: new Date().toTimeString().split(' ')[0].substring(0, 5),
        name: formData.name.trim(),
        studentClass: '',
        people: 1,
        food: formData.food,
        reservationNumber: null
      };

      const reservationsUrl = apiBase + 'sales-data.php?reservations=true';
      const res = await fetch(reservationsUrl, { cache: 'no-store' });
      if (!res.ok) {
        throw new Error(`予約データの取得に失敗しました`);
      }

      const raw = await res.json();
      let existingReservations = Array.isArray(raw) ? raw : (raw?.reservations || []);

      const today = reservation.date;
      const reservationName = reservation.name.trim();
      const duplicateReservation = existingReservations.find(r => {
        return (r.date || '') === today && (r.name || '').trim() === reservationName;
      });

      if (duplicateReservation) {
        throw new Error(`${today}に「${reservationName}」さんは既に予約済みです。`);
      }

      const usedNumbers = new Set(
        existingReservations
          .filter(r => String(r.date || '') === today)
          .map(r => parseInt(r.reservationNumber, 10))
          .filter(n => Number.isFinite(n) && n >= 1 && n <= 999)
      );

      let candidate = null;
      for (let i = 0; i < 2000; i++) {
        const n = Math.floor(Math.random() * 999) + 1;
        if (!usedNumbers.has(n)) { candidate = n; break; }
      }

      if (candidate === null) {
        for (let n = 1; n <= 999; n++) {
          if (!usedNumbers.has(n)) { candidate = n; break; }
        }
      }

      if (candidate === null) {
        throw new Error('本日の予約番号が上限に達しました（999件）。');
      }

      reservation.reservationNumber = candidate;
      existingReservations.push(reservation);

      const saveUrl = apiBase + 'sales-data.php';
      const saveResponse = await fetch(saveUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'save-all', reservations: existingReservations })
      });

      if (!saveResponse.ok) {
        throw new Error('予約の保存に失敗しました');
      }

      return reservation;
    }

    async function copyReservationNumberOnly() {
      const el = document.querySelector('.reservation-number');
      const text = el ? String(el.textContent || '').trim().replace(/\D/g, '').slice(0, 3) : '';
      const threeDigits = text.length > 0 ? text.padStart(3, '0').slice(-3) : '';
      const toCopy = threeDigits || '000';
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(toCopy);
          alert('予約番号（' + toCopy + '）をコピーしました！');
        } else {
          prompt('予約番号をコピーしてください:', toCopy);
        }
      } catch (e) {
        prompt('予約番号をコピーしてください:', toCopy);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      loadMenuAndStatus();

      const form = document.getElementById('booking-form');
      if (form) {
        form.addEventListener('submit', async function (e) {
          e.preventDefault();

          const formData = {
            name: document.getElementById('student-name').value.trim(),
            food: document.getElementById('food').value
          };

          if (!formData.name) {
            showResult(false, '<h3>❌ エラー</h3><p>お名前を入力してください。</p>');
            return;
          }

          if (!formData.food) {
            showResult(false, '<h3>❌ エラー</h3><p>メニューを選択してください。</p>');
            return;
          }

          const submitButton = document.getElementById('submit-btn');
          const originalText = submitButton.textContent;
          submitButton.disabled = true;
          submitButton.textContent = '送信中...';

          try {
            const reservation = await submitReservation(formData);
            const numStr = String(reservation.reservationNumber).padStart(3, '0');

            showResult(true, `
              <h3>🎉 予約が完了しました！</h3>
              <p>受け取りの際に以下の<strong>予約番号</strong>を食堂でお伝えください。</p>
              <div class="reservation-number">No. ${numStr}</div>
              <p><strong>お名前:</strong> ${escapeHtml(reservation.name)} 様</p>
              <p><strong>ご希望メニュー:</strong> ${escapeHtml(reservation.food)}</p>
              <div class="result-actions">
                <button class="btn btn-primary" onclick="copyReservationNumberOnly()">番号をコピー</button>
                <a href="verification.html" class="btn btn-secondary">予約を確認する</a>
              </div>
            `);

            document.getElementById('booking-form').reset();
            loadMenuAndStatus();
          } catch (error) {
            showResult(false, `<h3>❌ 予約エラー</h3><p>${escapeHtml(error.message)}</p>`);
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = originalText;
          }
        });
      }
    });
  </script>
