<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>【管理用】予約確認一覧（認証） - OliMeal</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0 20px 0;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin: 10px 0 20px 0;
      background: var(--primary-subtle);
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .filters label {
      font-weight: 800;
      color: var(--primary);
      font-size: 0.88rem;
    }

    .filters input,
    .filters select {
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      min-width: 180px;
      background-color: #ffffff;
      color: var(--text-main);
    }

    .filters input:focus,
    .filters select:focus {
      border-color: var(--primary);
      outline: none;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-soft);
      border: 1.5px solid var(--border-color);
    }

    /* テーブルのスタイル調整 */
    .reservation-table-container {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .reservation-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      background: #ffffff;
    }

    .reservation-table th {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 800;
      border: 1px solid var(--border-color);
      padding: 12px 10px;
      text-align: left;
    }

    .reservation-table td {
      border: 1px solid var(--border-color);
      padding: 12px 10px;
      font-size: 0.92rem;
    }

    .reservation-table tr.row-verified {
      background-color: var(--primary-subtle);
    }
  </style>
  <link rel="stylesheet" href="olimeal-interior.css">
</head>

<body class="olimeal-interior">
  <div class="container">
    <!-- 全ページ共通ナビゲーション -->
    <nav class="site-nav" aria-label="主なメニュー">
      <a class="site-nav-brand" href="index.html" aria-label="OliMeal ホーム">
        <img src="icon.png" alt="" class="logo-nav-icon">
        <span class="logo-nav-text">OliMeal</span>
      </a>
      <div class="site-nav-links">
        <a href="index.html">ホーム</a>
        <a href="book.html">予約する</a>
        <a href="verification.html" class="is-here">予約を確認</a>
        <a href="allergy.html">アレルギー</a>
        <a href="ai-assistant-php.html">質問する</a>
      </div>
    </nav>

    <header class="page-intro">
      <span class="eyebrow">スタッフ用</span>
      <h1>🧾 予約確認一覧（認証）</h1>
      <p class="lead">食堂スタッフ向け：予約の一覧確認と「認証（受け取り済み）」の更新ができます</p>
    </header>

    <main>
      <section class="card">
        <div class="actions">
          <button class="btn btn-primary" onclick="loadReservations()">予約一覧を更新</button>
          <a class="btn btn-secondary" href="verification.html">← 予約確認に戻る</a>
          <a class="btn btn-secondary" href="admin.html">← 管理画面に戻る</a>
        </div>
        <div class="filters">
          <div>
            <label for="filter-date">日付</label><br />
            <input id="filter-date" type="date" />
          </div>
          <div>
            <label for="filter-status">表示</label><br />
            <select id="filter-status">
              <option value="today">今日の予約のみ</option>
              <option value="all">すべて</option>
              <option value="unverified">未認証のみ</option>
              <option value="verified">認証済みのみ</option>
            </select>
          </div>
          <div>
            <label for="filter-q">検索（名前/クラス/番号/メニュー）</label><br />
            <input id="filter-q" type="text" placeholder="例: 田中 / 2A / 123 / カレー" />
          </div>
        </div>
        <div id="reservations-list"></div>
        <p style="margin-top: 14px; color: var(--text-muted); font-size: 0.85rem;">
          ※ ファイルを直接開いている（URLが <code>file://</code> で始まる）場合、PHP(API)が動かず一覧取得に失敗します。Webサーバー経由で開いてください。
        </p>
      </section>

      <section>
        <h2>🔗 URLリンク</h2>
        <div id="page-links" class="card"></div>
      </section>
    </main>

    <footer>
      <a href="index.html" class="back-link">← メインページに戻る</a>
    </footer>
  </div>

  <script>
    function getApiBaseCandidates() {
      if (typeof window === 'undefined' || !window.location) return ['api/'];
      if (window.location.protocol === 'file:') return ['api/'];
      const sameDir = new URL('api/', window.location.href).toString();
      const parentDir = new URL('../api/', window.location.href).toString();
      const rootDir = window.location.origin + '/api/';
      const candidates = [sameDir, parentDir, rootDir].filter(u => {
        try { return new URL(u).origin === window.location.origin; } catch (_) { return false; }
      });
      return [...new Set(candidates)];
    }

    async function apiGet(path) {
      const candidates = getApiBaseCandidates();
      let lastErr = null;
      for (const base of candidates) {
        try {
          const res = await fetch(base + path, { cache: 'no-store' });
          if (!res.ok) { lastErr = new Error(`GET failed: ${base}${path} (HTTP ${res.status})`); continue; }
          const text = await res.text();
          try { return JSON.parse(text); } catch (e) { lastErr = e; continue; }
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('GET failed');
    }

    async function apiPost(path, data) {
      const candidates = getApiBaseCandidates();
      let lastErr = null;
      for (const base of candidates) {
        try {
          const res = await fetch(base + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          if (!res.ok) { lastErr = new Error(`POST failed: ${base}${path} (HTTP ${res.status})`); continue; }
          return await res.json();
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('POST failed');
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getTodayIso() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    async function markReservationAsVerified(name, number) {
      return await apiPost('sales-data.php', {
        action: 'verify',
        name: String(name || '').trim(),
        reservationNumber: parseInt(number, 10)
      });
    }

    async function loadReservations() {
      const list = document.getElementById("reservations-list");
      let reservations = [];
      const isFileProtocol = window.location.protocol === 'file:';
      list.innerHTML = "<p style='color:var(--text-muted);'>読み込み中...</p>";
      try {
        const candidates = getApiBaseCandidates();
        let raw = null;
        for (const base of candidates) {
          try {
            const res = await fetch(base + 'sales-data.php?reservations=true', { cache: 'no-store' });
            if (res.ok) { raw = await res.json(); break; }
          } catch (_) {}
        }
        if (Array.isArray(raw)) {
          reservations = raw;
        } else if (raw && Array.isArray(raw.reservations)) {
          reservations = raw.reservations;
        } else {
          reservations = [];
        }
      } catch (e) {
        console.error('予約一覧の取得に失敗:', e);
        let errMsg = '予約データの取得に失敗しました。';
        if (isFileProtocol) {
          errMsg += '<br><strong>※ ファイルを直接開いています。</strong> 予約を表示するには、PHPが動作するWebサーバー経由で開いてください。';
        } else {
          errMsg += ' しばらくしてから「予約一覧を更新」を押すか、ページを再読み込みしてください。';
        }
        list.innerHTML = "<p style='color:var(--accent-orange);'>" + errMsg + "</p>";
        return;
      }

      if (reservations.length === 0) {
        let emptyMsg = '☕️ 現在、対象の予約はありません（0件）。';
        emptyMsg += '<br>生徒からの予約が入った後に「予約一覧を更新」を押してください。';
        if (isFileProtocol) {
          emptyMsg += '<br><span style="color:var(--accent-orange);"><strong>※ ファイルで直接開いていると予約は保存・表示されません。</strong> Webサーバー経由で開いてください。</span>';
        }
        list.innerHTML = "<p style='color:var(--text-muted); line-height: 1.6;'>" + emptyMsg + "</p>";
        return;
      }

      const filterDateEl = document.getElementById('filter-date');
      const filterStatusEl = document.getElementById('filter-status');
      const filterQEl = document.getElementById('filter-q');
      const selectedDate = (filterDateEl && filterDateEl.value) ? filterDateEl.value : getTodayIso();
      const mode = filterStatusEl ? filterStatusEl.value : 'today';
      const q = filterQEl ? String(filterQEl.value || '').trim().toLowerCase() : '';

      const isVerifiedFn = (r) => r.verified === true || r.verified === 'true' || r.verified === 1;

      let filtered = reservations;
      if (mode === 'today') {
        filtered = filtered.filter(r => String(r.date || '') === selectedDate);
      } else if (mode === 'unverified') {
        filtered = filtered.filter(r => !isVerifiedFn(r));
      } else if (mode === 'verified') {
        filtered = filtered.filter(r => isVerifiedFn(r));
      }
      if (q) {
        filtered = filtered.filter(r => {
          const name = String(r.name || '').toLowerCase();
          const cls = String(r.studentClass || '').toLowerCase();
          const food = String(r.food || '').toLowerCase();
          const num = (r.reservationNumber != null ? String(r.reservationNumber) : '');
          return name.includes(q) || cls.includes(q) || food.includes(q) || num.includes(q);
        });
      }

      if (filtered.length === 0) {
        list.innerHTML = "<p style='color:var(--text-muted);'>🔍 条件に一致する予約が見つかりませんでした。</p>";
        return;
      }

      filtered = [...filtered].sort((a, b) => {
        const dateA = (a.date || '') + ' ' + (a.time || '');
        const dateB = (b.date || '') + ' ' + (b.time || '');
        return dateB.localeCompare(dateA);
      });

      window.__visibleReservations = filtered;

      const tableRows = filtered.map((r, idx) => {
        const name = escapeHtml(String(r.name || '').trim() || '—');
        const cls = escapeHtml(String(r.studentClass || '').trim() || '—');
        const food = escapeHtml(String(r.food || '').trim() || '—');
        const date = escapeHtml(String(r.date || '—'));
        const time = escapeHtml(String(r.time || '—'));
        const num = r.reservationNumber != null ? r.reservationNumber : '—';
        const isVerified = isVerifiedFn(r);
        const verifiedMark = isVerified ? '<span style="color: var(--primary); font-weight: bold;">✅ 認証済</span>' : '<span style="color: var(--text-muted);">未受け取り</span>';
        const actionBtn = isVerified
          ? `<button class="btn btn-secondary btn-disabled" disabled>受け取り完了</button>`
          : `<button class="btn btn-success" onclick="handleVerifyClick(${idx})">認証（受け取り）</button>`;
        return `
          <tr class="${isVerified ? 'row-verified' : ''}">
            <td>${date}</td>
            <td>${time}</td>
            <td style="font-weight: bold; color: var(--primary);">${name}</td>
            <td>${cls}</td>
            <td>${food}</td>
            <td style="font-weight: 800; color: var(--primary);">${num}</td>
            <td style="text-align: center;">${verifiedMark}</td>
            <td style="text-align: center;">${actionBtn}</td>
          </tr>
        `;
      }).join('');

      list.innerHTML = `
        <div style="margin-bottom: 20px;">
          <h3 style="margin: 0 0 10px 0; color: var(--primary); font-weight: 800;">📋 予約一覧（認証/受け取り管理）</h3>
          <p style="margin: 0 0 12px 0; color: var(--text-muted); font-size: 0.9rem;">
            表示件数: <strong>${filtered.length}</strong> 件
          </p>
          <div class="reservation-table-container">
            <table class="reservation-table">
              <thead>
                <tr>
                  <th>日付</th>
                  <th>時間</th>
                  <th>予約者名</th>
                  <th>クラス</th>
                  <th>予約メニュー</th>
                  <th>予約番号</th>
                  <th style="text-align: center;">ステータス</th>
                  <th style="text-align: center;">操作</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    async function handleVerifyClick(index) {
      try {
        const items = Array.isArray(window.__visibleReservations) ? window.__visibleReservations : [];
        const r = items[index];
        if (!r) return;
        const name = String(r.name || '').trim();
        const num = r.reservationNumber;
        if (!name || num == null) {
          alert('認証に必要な情報（名前/予約番号）が不足しています。');
          return;
        }
        const ok = confirm(`「${name}」（予約番号: ${num}）を認証（受け取り済み）にしますか？`);
        if (!ok) return;

        await markReservationAsVerified(name, num);
        await loadReservations();
      } catch (e) {
        console.error('認証更新に失敗:', e);
        alert('認証の更新に失敗しました。サーバー状況を確認して再度お試しください。');
      }
    }

    function renderLinks() {
      const base = window.location.href.replace(/[^/]*$/, '');
      const pages = [
        { name: '生徒用サイト (index.html)', file: 'index.html' },
        { name: '予約確認システム (verification.html)', file: 'verification.html' },
        { name: '管理者サイト (admin.html)', file: 'admin.html' },
        { name: '食堂専用AIアシスタント (ai-assistant-php.html)', file: 'ai-assistant-php.html' }
      ];
      const linksDiv = document.getElementById('page-links');
      if (!linksDiv) return;
      linksDiv.innerHTML = pages.map(p => {
        const url = base + p.file;
        return `<p style="margin-bottom: 8px;"><strong>${p.name}:</strong> <a href="${url}" style="color: var(--primary); font-weight: 700;">${url}</a></p>`;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderLinks();
      const dateEl = document.getElementById('filter-date');
      if (dateEl) dateEl.value = getTodayIso();
      const statusEl = document.getElementById('filter-status');
      const qEl = document.getElementById('filter-q');
      const reload = () => loadReservations();
      if (dateEl) dateEl.addEventListener('change', reload);
      if (statusEl) statusEl.addEventListener('change', reload);
      if (qEl) qEl.addEventListener('input', reload);

      loadReservations();
      setInterval(loadReservations, 30000);
    });
  </script>
</body>

</html>
