<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定食カレンダー - OliMeal</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* カレンダー内の『好きそうな日』のハイライト */
    .calendar-day.liked {
      background: var(--accent-sun-light);
      border-color: var(--accent-sun);
      font-weight: 800;
      color: var(--text-main);
    }

    .calendar-day.liked small {
      color: var(--primary);
      font-weight: 800;
    }

    /* お知らせメッセージカード */
    .star-note {
      background: var(--accent-sun-light);
      border: 1.5px solid var(--accent-sun);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: var(--text-main);
      box-shadow: var(--shadow-soft);
      line-height: 1.6;
    }

    /* 凡例（色の説明）の調整 */
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.88rem;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .swatch.liked {
      background-color: var(--accent-sun-light);
      border: 1.5px solid var(--accent-sun);
    }
  </style>
  <link rel="stylesheet" href="olimeal-interior.css">
</head>

<body class="olimeal-interior">
  <div class="container">
    <!-- 全ページ共通ナビゲーション -->
    <nav class="site-nav" aria-label="主なメニュー">
      <a class="site-nav-brand" href="index.html" aria-label="OliMeal ホーム">
        <img src="icon.png" alt="" class="logo-nav-icon">
        <span class="logo-nav-text">OliMeal</span>
      </a>
      <div class="site-nav-links">
        <a href="index.html">ホーム</a>
        <a href="book.html">予約する</a>
        <a href="verification.html">予約を確認</a>
        <a href="allergy.html">アレルギー</a>
        <a href="ai-assistant-php.html">質問する</a>
      </div>
    </nav>

    <header class="page-intro">
      <span class="eyebrow">LINE連携</span>
      <h1 id="cal-title">定食カレンダー</h1>
      <p class="lead" id="cal-lead">アンケートで答えた好きな食べ方から、合いそうな日に星をつけます。</p>
    </header>

    <main>
      <div id="star-note" class="star-note" hidden></div>

      <div class="legend">
        <span><span class="swatch today"></span>緑の枠はきょう</span>
        <span><span class="swatch holiday"></span>オレンジは休み</span>
        <span><span class="swatch liked"></span>黄色い枠は好きそうな定食</span>
      </div>

      <div id="calendar" class="info-card calendar-container">
        <div class="loading">
          <div class="spinner"></div>
          <p>読み込んでいます…</p>
        </div>
      </div>

      <div class="info-card" style="margin-top: 20px;">
        <p class="help-note" style="margin-bottom: 0;">
          💡 予約は、LINEのトークで「予約する」を押すか、いつもの予約ページからできます。LINEをしていない人は、いつもの予約ページを使ってください。
        </p>
      </div>

      <div style="text-align: center; margin-top: 24px;">
        <a class="btn btn-primary" href="book.html">いつもの予約ページへ</a>
      </div>
    </main>

    <footer>
      <p>学校食堂 OliMeal</p>
    </footer>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const key = params.get('key') || '';

    function render(data) {
      const title = document.getElementById('cal-title');
      const note = document.getElementById('star-note');
      if (data.name) {
        title.textContent = data.name + 'さんの定食カレンダー';
        note.hidden = false;
        note.textContent = '⭐ 黄色い枠の日は、アンケートの答えから好きそうな定食です。';
      } else {
        note.hidden = false;
        note.textContent = '💡 星をつけるには、LINEのトークからこのカレンダーを開いてください。';
      }
      const year = data.year;
      const month = data.month;
      const first = new Date(year, month - 1, 1).getDay();
      const names = ['日', '月', '火', '水', '木', '金', '土'];
      let html = '<div class="calendar-header"><h4>' + year + '年 ' + month + '月</h4></div><div class="calendar-grid"><div class="calendar-weekdays">';
      names.forEach(function (name) { html += '<div class="calendar-weekday">' + name + '</div>'; });
      html += '</div><div class="calendar-days">';
      for (let i = 0; i < first; i++) html += '<div class="calendar-day empty"></div>';
      (data.days || []).forEach(function (day) {
        let cls = 'calendar-day';
        if (day.today) cls += ' today';
        if (day.holiday) cls += ' holiday';
        if (day.liked) cls += ' liked';
        let body = String(day.day);
        if (day.holiday) body += '<br><small>' + escapeHtml(day.holiday) + '</small>';
        else if (day.food) body += '<br><small>' + (day.liked ? '★ ' : '') + escapeHtml(day.food) + '</small>';
        if (day.event) body += '<br><small>' + escapeHtml(day.event) + '</small>';
        html += '<div class="' + cls + '">' + body + '</div>';
      });
      html += '</div></div>';
      document.getElementById('calendar').innerHTML = html;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    function loadJson(url) {
      return fetch(url, { cache: 'no-store' }).then(function (res) {
        if (!res.ok) throw new Error('failed');
        return res.json();
      });
    }

    function monthFromSources(menus, holidays) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const today = year + '-' + String(month).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      const last = new Date(year, month, 0).getDate();
      const holidayMap = {};
      (holidays || []).forEach(function (row) {
        if (row && row.date) holidayMap[row.date] = row.reason || '休み';
      });
      const foodMap = {};
      (menus || []).forEach(function (row) {
        if (row && row.date) foodMap[row.date] = row.food || '';
      });
      const days = [];
      for (let day = 1; day <= last; day++) {
        const date = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        days.push({
          date: date,
          day: day,
          food: foodMap[date] || '',
          holiday: holidayMap[date] || null,
          event: '',
          liked: false,
          today: date === today
        });
      }
      return { year: year, month: month, name: '', days: days };
    }

    Promise.all([
      loadJson('api/daily-menu.php').catch(function () { return []; }),
      loadJson('api/holidays.php').catch(function () { return []; }),
      loadJson('api/line-calendar.php?key=' + encodeURIComponent(key)).catch(function () { return null; })
    ]).then(function (results) {
      const base = monthFromSources(results[0], results[1]);
      const personal = results[2];
      if (personal && personal.days) {
        const liked = {};
        personal.days.forEach(function (day) { liked[day.date] = !!day.liked; });
        base.days.forEach(function (day) { day.liked = !!liked[day.date]; });
        if (personal.name) base.name = personal.name;
      }
      render(base);
    }).catch(function () {
      document.getElementById('calendar').innerHTML = '<p style="color: var(--accent-orange); text-align: center; padding: 20px;">❌ カレンダーを読み込めませんでした。</p>';
    });
  </script>
</body>

</html>
