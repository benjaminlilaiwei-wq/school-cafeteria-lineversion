<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感想を書く - OliMeal</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .review-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #545b62;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        .reviews-list {
            margin-top: 30px;
        }

        .review-item {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .review-name {
            font-weight: bold;
            color: #333;
        }

        .review-date {
            font-size: 14px;
            color: #666;
        }

        .review-comment {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <nav class="site-nav" aria-label="主なメニュー">
            <a class="site-nav-brand" href="index.html">OliMeal</a>
            <div class="site-nav-links">
                <a href="index.html">ホーム</a>
                <a href="book.html">予約する</a>
                <a href="verification.html">予約を確認</a>
                <a href="allergy.html">アレルギー</a>
                <a href="ai-assistant-php.html">質問する</a>
            </div>
        </nav>
        <header class="page-intro">
            <h1>感想を書く</h1>
            <p class="lead">よかったことや、気になったことを自由に書いてください。名前は空欄でも送れます。</p>
        </header>

        <main>
            <section class="review-section">
                <div class="review-card">
                    <h2>感想を送る</h2>

                    <form id="review-form">
                        <div class="form-group">
                            <label for="review-name">お名前（任意）</label>
                            <input type="text" id="review-name" placeholder="例: 田中太郎（匿名の場合は空白のまま）">
                        </div>

                        <div class="form-group">
                            <label for="review-comment">コメント *</label>
                            <textarea id="review-comment" required placeholder="ご意見・ご感想を自由に入力してください"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">感想を送る</button>
                            <button type="button" onclick="resetReviewForm()" class="btn btn-secondary">入力を消す</button>
                        </div>
                    </form>

                    <div id="message" class="message hidden"></div>
                </div>
            </section>

            <section class="reviews-list">
                <div class="review-card">
                    <h2>みんなの感想</h2>
                    <div id="reviews-display">
                        <p>レビューを読み込み中...</p>
                    </div>
                </div>
            </section>

        </main>

        <footer>
            <a href="index.html" class="back-link">ホームに戻る</a>
        </footer>
    </div>

    <script>
        // レビューを投稿
        async function submitReview(name, comment) {
            try {
                const response = await fetch('api/reviews.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name || '',
                        comment: comment
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
                    throw new Error(errorData.error || 'レビューの投稿に失敗しました');
                }

                return await response.json();
            } catch (error) {
                console.error('レビュー投稿エラー:', error);
                throw error;
            }
        }

        // レビュー一覧を取得
        async function loadReviews() {
            try {
                const response = await fetch('api/reviews.php');
                if (!response.ok) {
                    throw new Error('レビューの取得に失敗しました');
                }
                const reviews = await response.json();
                displayReviews(reviews);
            } catch (error) {
                console.error('レビュー取得エラー:', error);
                document.getElementById('reviews-display').innerHTML =
                    '<p style="color: red;">レビューの読み込みに失敗しました。</p>';
            }
        }

        // レビューを表示
        function displayReviews(reviews) {
            const displayDiv = document.getElementById('reviews-display');

            if (!reviews || reviews.length === 0) {
                displayDiv.innerHTML = '<p>まだレビューがありません。最初のレビューを投稿してみませんか？</p>';
                return;
            }

            displayDiv.innerHTML = reviews.map(review => {
                const date = review.date || '日付不明';
                return `
                    <div class="review-item">
                        <div class="review-header">
                            <span class="review-date">${escapeHtml(date)}</span>
                        </div>
                        <div class="review-comment">${escapeHtml(review.comment)}</div>
                    </div>
                `;
            }).join('');
        }

        // HTMLエスケープ
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // メッセージを表示
        function showMessage(message, isSuccess) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${isSuccess ? 'success' : 'error'}`;
            messageDiv.classList.remove('hidden');

            if (isSuccess) {
                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 3000);
            }
        }

        // フォーム送信処理
        document.getElementById('review-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('review-name').value.trim();
            const comment = document.getElementById('review-comment').value.trim();

            if (!comment) {
                showMessage('コメントを入力してください', false);
                return;
            }

            try {
                await submitReview(name, comment);
                showMessage('レビューを投稿しました！ありがとうございます。', true);
                document.getElementById('review-form').reset();
                // レビュー一覧を再読み込み
                setTimeout(() => {
                    loadReviews();
                }, 500);
            } catch (error) {
                showMessage(error.message || 'レビューの投稿に失敗しました', false);
            }
        });

        // フォームリセット
        function resetReviewForm() {
            document.getElementById('review-form').reset();
            document.getElementById('message').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadReviews();
        });
    </script>
</body>

</html>
